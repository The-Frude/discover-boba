name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    # Uncomment when tests are added
    # - name: Run tests
    #   run: npm test

    - name: Build project
      run: npm run build
      env:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}

  # Deployment is handled by Vercel's own GitHub integration (triggers on
  # every push to main automatically). There used to be a second explicit
  # `vercel --prod` deploy job here too - two independent deployments of
  # the same commit racing to alias production was a real source of
  # transient post-deploy inconsistency. This job is CI validation only
  # (lint + build) and intentionally does not deploy.
